# Butterfly 主题个性化配置（覆盖主题默认值）

# =========================================================
# 导航菜单
# =========================================================
menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  分类: /categories/ || fas fa-folder-open
  标签: /tags/ || fas fa-tags
  知识库: /knowledge/ || fas fa-book
  友链: /links/ || fas fa-link
  关于: /about/ || fas fa-user

# =========================================================
# 导航栏
# =========================================================
nav:
  display_title: true
  display_post_title: true
  fixed: true

# =========================================================
# 主题主色（运维蓝 + 科技感）
# =========================================================
theme_color:
  enable: true
  main: "#49b1f5"
  paginator: "#00c4b6"
  button_hover: "#FF7242"
  text_selection: "#00c4b6"
  link_color: "#99a9bf"
  meta_color: "#858585"
  hr_color: "#A4D8FA"
  code_foreground: "#F47466"
  code_background: "rgba(27, 31, 35, .05)"
  toc_color: "#00c4b6"
  blockquote_padding_color: "#49b1f5"
  blockquote_background_color: "#49b1f5"
  scrollbar_color: "#49b1f5"
  meta_theme_color_light: "ffffff"
  meta_theme_color_dark: "#0d0d0d"

# =========================================================
# 头像
# =========================================================
avatar:
  img: /img/avatar.png
  effect: true

# =========================================================
# 社交链接
# =========================================================
social:
  fab fa-github: https://github.com/dr1ft0 || GitHub || '#24292e'
  fas fa-envelope: mailto:dr1ft0@example.com || Email || '#4a7dbe'
  fas fa-rss: /atom.xml || RSS || '#ffa500'

# =========================================================
# 首页横幅
# =========================================================
# 首页打字机副标题
subtitle:
  enable: true
  effect: true
  typed_option:
    strings:
      - IT 运维工程师
      - 基础架构方向 · 网络
      - 记录故障 · 沉淀知识 · 持续成长
      - 网络自动化 → DevOps / SRE
    typeSpeed: 70
    backSpeed: 40
    loop: true
  source: false
  sub: 运维周记 · 故障复盘 · 技术笔记

# 首页文章布局
index_layout: 3

# 首页文章摘要
index_post_content:
  method: 2
  length: 500

# =========================================================
# 文章设置
# =========================================================
toc:
  post: true
  page: true
  number: true
  expand: false
  style_simple: false
  scroll_percent: true

# 文章版权
post_copyright:
  enable: true
  decode: false
  author_href: https://github.com/dr1ft0
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

# 相关文章
related_post:
  enable: true
  limit: 6
  date_type: created

# 文章分页
post_pagination: 1

# 文章过期提醒
noticeOutdate:
  enable: true
  style: flat
  limit_day: 180
  position: top
  message_prev: 本文发布于
  message_next: 天前，内容可能已过时，请注意甄别。

# =========================================================
# 代码块
# =========================================================
code_blocks:
  theme: light
  macStyle: true
  height_limit: false
  word_wrap: false
  copy: true
  language: true
  shrink: false
  fullpage: true

# =========================================================
# 页脚
# =========================================================
footer:
  owner:
    enable: true
    since: 2023
  copyright:
    enable: true
    version: true
  custom_text: 记录运维路上的每一步

# =========================================================
# 侧边栏
# =========================================================
aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: IT 运维工程师（基础架构方向）
    button:
      enable: true
      icon: fab fa-github
      text: 关注我
      link: https://github.com/dr1ft0
  card_announcement:
    enable: true
    content: 🚀 欢迎来到我的博客！这里记录运维工作中的故障复盘、技术笔记与成长历程。
  card_recent_post:
    enable: true
    limit: 5
    sort: date
    sort_order:
  card_categories:
    enable: true
    limit: 8
    expand: none
    sort_order:
  card_tags:
    enable: true
    limit: 40
    color: true
    orderby: random
    order: 1
  card_archives:
    enable: true
    type: monthly
    format: MMMM YYYY
    order: -1
    limit: 8
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true
    runtime_date: 09/01/2026 09:00:00

# =========================================================
# 右下角按钮
# =========================================================
rightside_scroll_percent: true
rightside_config_animation: true

# 繁简转换
translate:
  enable: true
  default: 繁
  defaultEncoding: 2
  translateDelay: 0
  msgToTraditionalChinese: '繁'
  msgToSimplifiedChinese: '簡'

# 阅读模式
readmode: true

# 暗黑模式
darkmode:
  enable: true
  button: true
  autoChangeMode: 1
  start: 6
  end: 18

# =========================================================
# 全局设置
# =========================================================
anchor:
  auto_update: true
  click_to_scroll: true

# 复制版权
copy:
  enable: true
  copyright:
    enable: true
    limit_count: 150

# 字数统计
wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true

# 访问统计（不蒜子）
busuanzi:
  site_uv: true
  site_pv: true
  page_pv: true

# =========================================================
# 搜索
# =========================================================
search:
  use: local_search
  placeholder: 搜索文章...

  local_search:
    preload: true
    top_n_per_article: 1
    unescape: true
    pagination:
      enable: true
      hitsPerPage: 8

# =========================================================
# 分享
# =========================================================
share:
  use: sharejs
  sharejs:
    sites: wechat,weibo,qq

# =========================================================
# 评论（默认关闭，可配置 Giscus）
# =========================================================
comments:
  use: []
  text: true
  lazyload: false
  count: false
  card_post_count: false

# =========================================================
# 美化 / 特效
# =========================================================
# 圆角
rounded_corners_ui: true

# 遮罩
mask:
  header: true
  footer: true

# 加载动画
preloader:
  enable: true
  source: 1

# 页面过渡
enter_transitions: true

# 默认显示模式
display_mode: light

# 文章美化
beautify:
  enable: true
  field: post
  title_prefix_icon: '\f0c1'
  title_prefix_icon_color: '#F47466'

# 分割线图标
hr_icon:
  enable: true

# 打字机特效
activate_power_mode:
  enable: false
  colorful: true
  shake: true
  mobile: false

# 背景特效 - 粒子线条
canvas_nest:
  enable: true
  color: '73,177,245'
  opacity: 0.5
  zIndex: -1
  count: 99
  mobile: false

# 鼠标点击特效 - 烟花
fireworks:
  enable: true
  zIndex: 9999
  mobile: false

# 鼠标点击特效 - 爱心
click_heart:
  enable: true
  mobile: false

# =========================================================
# 图片灯箱
# =========================================================
lightbox: fancybox

# =========================================================
# 标签插件
# =========================================================
# 系列文章
series:
  enable: true
  orderBy: 'date'
  order: -1
  number: true

# Mermaid 图表
mermaid:
  enable: true
  code_write: true
  theme:
    light: default
    dark: dark
  open_in_new_tab: true
  zoom_pan: true

# Note 提示框
note:
  style: flat
  icons: true
  border_radius: 3
  light_bg_offset: 0

# =========================================================
# 其他
# =========================================================
# Pjax 无刷新跳转
pjax:
  enable: true
  exclude:

# Snackbar 通知
snackbar:
  enable: true
  position: bottom-left
  bg_light: '#49b1f5'
  bg_dark: '#1f1f1f'

# 图片懒加载
lazyload:
  enable: true
  native: false
  field: site
  blur: true

# 结构化数据
structured_data:
  enable: true
  alternate_name: ['Dr1ft0 的博客', '运维知识库']

# 注入自定义代码
inject:
  head:
    - <link rel="stylesheet" href="/css/custom.css">
  bottom:
    - <script src="/js/custom.js"></script>
